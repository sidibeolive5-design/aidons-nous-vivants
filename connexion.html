<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Connexion - AIDONS-NOUS VIVANTS</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fa;
      color: #172033;
    }

    header {
      background: #0b6b4f;
      color: white;
      padding: 22px 18px;
      text-align: center;
    }

    header h1 {
      font-size: 23px;
    }

    .container {
      padding: 30px 18px;
      max-width: 500px;
      margin: auto;
    }

    .card {
      background: white;
      padding: 25px 20px;
      border-radius: 16px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
    }

    h2 {
      text-align: center;
      margin-bottom: 10px;
    }

    .intro {
      text-align: center;
      color: #687282;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d5dae0;
      border-radius: 9px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #0b6b4f;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    .links {
      text-align: center;
      margin-top: 20px;
      line-height: 2;
    }

    .links a {
      color: #0b6b4f;
      text-decoration: none;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #687282;
      font-size: 13px;
    }
  </style>
</head>

<body>

<header>
  <h1>AIDONS-NOUS VIVANTS</h1>
</header>

<div class="container">

  <div class="card">

    <h2>Se connecter</h2>

    <p class="intro">
      Accédez à votre espace membre.
    </p>

    <form>

      <label>Numéro de téléphone</label>

      <input
        type="tel"
        placeholder="Exemple : 07 00 00 00 00"
        required
      >

      <label>Mot de passe</label>

      <input
        type="password"
        placeholder="Votre mot de passe"
        required
      >

      <button type="submit">
        Se connecter
      </button>

    </form>

    <div class="links">

      <a href="#">Mot de passe oublié ?</a>

      <br>

      <a href="inscription.html">
        Créer un compte
      </a>

      <br>

      <a href="index.html">
        ← Retour à l'accueil
      </a>

    </div>

  </div>

</div>

<footer>
  © 2026 AIDONS-NOUS VIVANTS
</footer>

</body>
  </html>
