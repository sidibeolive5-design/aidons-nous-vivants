<!DOCTYPE html><html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>Créer mon compte - AIDONS-NOUS VIVANTS</title>  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fa;
      color: #172033;
    }

    header {
      background: #0b6b4f;
      color: white;
      padding: 22px 18px;
      text-align: center;
    }

    header h1 {
      font-size: 23px;
    }

    .container {
      padding: 25px 18px;
      max-width: 500px;
      margin: auto;
    }

    .card {
      background: white;
      padding: 25px 20px;
      border-radius: 16px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
    }

    h2 {
      text-align: center;
      margin-bottom: 10px;
    }

    .intro {
      text-align: center;
      color: #687282;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 14px;
      border: 1px solid #d5dae0;
      border-radius: 9px;
      font-size: 16px;
    }

    .check {
      display: flex;
      gap: 10px;
      margin-top: 20px;
      font-size: 14px;
      line-height: 1.4;
    }

    .check input {
      width: auto;
      margin-top: 3px;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #0b6b4f;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    .message {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #0b6b4f;
      text-decoration: none;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #687282;
      font-size: 13px;
    }
  </style></head><body><header>
  <h1>AIDONS-NOUS VIVANTS</h1>
</header><div class="container">  <div class="card"><h2>Créer mon compte</h2>

<p class="intro">
  Remplissez vos informations pour rejoindre
  AIDONS-NOUS VIVANTS.
</p>

<form id="inscriptionForm">

  <label for="nom">Nom</label>
  <input
    id="nom"
    type="text"
    placeholder="Exemple : Kouassi"
    required
  >

  <label for="prenom">Prénom</label>
  <input
    id="prenom"
    type="text"
    placeholder="Exemple : Yasmine"
    required
  >

  <label for="telephone">Numéro de téléphone</label>
  <input
    id="telephone"
    type="tel"
    placeholder="Exemple : 07 00 00 00 00"
    required
  >

  <label for="email">Email</label>
  <input
    id="email"
    type="email"
    placeholder="Exemple : exemple@email.com"
    required
  >

  <label for="ville">Ville</label>
  <select id="ville" required>
    <option value="">Sélectionnez votre ville</option>
    <option value="Abidjan">Abidjan</option>
    <option value="Bouaké">Bouaké</option>
    <option value="Yamoussoukro">Yamoussoukro</option>
    <option value="San-Pédro">San-Pédro</option>
    <option value="Korhogo">Korhogo</option>
    <option value="Autre">Autre</option>
  </select>

  <label for="password">Mot de passe</label>
  <input
    id="password"
    type="password"
    placeholder="Créer un mot de passe"
    minlength="6"
    required
  >

  <div class="check">
    <input id="reglement" type="checkbox" required>

    <span>
      J'accepte le règlement de la tontine
      AIDONS-NOUS VIVANTS.
    </span>
  </div>

  <button id="submitButton" type="submit">
    Créer mon compte
  </button>

  <div id="message" class="message"></div>

</form>

<a href="index.html" class="back">
  ← Retour à l'accueil
</a>

  </div></div><footer>
  © 2026 AIDONS-NOUS VIVANTS
</footer><!-- Supabase --><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>

  const SUPABASE_URL = "https://wwmndbzifmlqpkbpcntz.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_jnjVBvAwxelousFOy8UEzQ_CZ4mb86b";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  const form = document.getElementById("inscriptionForm");
  const message = document.getElementById("message");
  const submitButton = document.getElementById("submitButton");

  form.addEventListener("submit", async function(event) {

    event.preventDefault();

    message.textContent = "";
    submitButton.disabled = true;
    submitButton.textContent = "Création du compte...";

    const nom = document.getElementById("nom").value.trim();
    const prenom = document.getElementById("prenom").value.trim();
    const telephone = document.getElementById("telephone").value.trim();
    const email = document.getElementById("email").value.trim();
    const ville = document.getElementById("ville").value;
    const password = document.getElementById("password").value;

    try {

      const { data, error } = await supabaseClient.auth.signUp({
        email: email,
        password: password
      });

      if (error) {
        throw error;
      }

      if (!data.user) {
        throw new Error("Le compte n'a pas pu être créé.");
      }

      const { error: profileError } = await supabaseClient
        .from("profiles")
        .insert({
  "Id": data.user.id,
  "Nom": nom,
  "Prenom": prenom,
  "Numéro de téléphone": telephone,
  "Email": email,
  "Ville": ville
});
        if (profileError) {
        throw profileError;
      }

      message.textContent =
        "Compte créé avec succès ! Vérifiez votre email si une confirmation est demandée.";

      message.style.color = "#0b6b4f";

      setTimeout(function() {
        window.location.href = "connexion.html";
      }, 2000);

    } catch (error) {

      console.error(error);

      message.textContent =
        "Erreur : " + error.message;

      message.style.color = "#c0392b";

      submitButton.disabled = false;
      submitButton.textContent = "Créer mon compte";
    }

  });

</script></body>
</html>
