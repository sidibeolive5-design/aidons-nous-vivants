<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://wwmndbzifmlqpkbpcntz.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_jnjVBvAwxelousFOy8UEzQ_CZ4mb86b";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


// ================================
// RÉCUPÉRER L'ID
// ================================

const urlParams = new URLSearchParams(
  window.location.search
);

const tontineId = urlParams.get("id");


// ================================
// CHARGER LA TONTINE
// ================================

async function loadTontine() {

  const content =
    document.getElementById("content");


  try {

    // Vérifier l'ID
    if (!tontineId) {

      content.innerHTML = `
        <div class="error">
          <strong>❌ ID manquant</strong><br><br>
          Aucun identifiant de tontine n'est présent dans l'adresse.
        </div>
      `;

      return;
    }


    // Afficher temporairement l'ID
    content.innerHTML = `
      <div class="loading">
        🔄 Recherche de la tontine...<br><br>
        ID : ${tontineId}
      </div>
    `;


    // Vérifier la connexion
    const {
      data: sessionData,
      error: sessionError
    } = await supabaseClient.auth.getUser();


    if (sessionError) {

      content.innerHTML = `
        <div class="error">
          <strong>❌ Erreur de connexion</strong><br><br>
          ${sessionError.message}
        </div>
      `;

      return;
    }


    if (!sessionData || !sessionData.user) {

      content.innerHTML = `
        <div class="error">
          <strong>❌ Vous n'êtes pas connecté.</strong><br><br>
          Vous devez être connecté pour consulter cette tontine.
        </div>
      `;

      return;
    }


    // ================================
    // REQUÊTE SUPABASE
    // ================================

    const {
      data: tontine,
      error: tontineError
    } = await supabaseClient
      .from("tontines")
      .select("*")
      .eq("id", tontineId)
      .maybeSingle();


    // Erreur Supabase
    if (tontineError) {

      console.error(
        "ERREUR SUPABASE :",
        tontineError
      );

      content.innerHTML = `
        <div class="error">

          <strong>❌ Erreur Supabase</strong>

          <br><br>

          <strong>Message :</strong><br>
          ${tontineError.message}

          <br><br>

          <strong>Code :</strong><br>
          ${tontineError.code || "Non disponible"}

          <br><br>

          <strong>Détails :</strong><br>
          ${tontineError.details || "Non disponible"}

        </div>
      `;

      return;
    }


    // Aucune tontine trouvée
    if (!tontine) {

      content.innerHTML = `
        <div class="error">

          <strong>❌ Tontine introuvable</strong>

          <br><br>

          L'ID suivant ne correspond à aucune tontine :

          <br><br>

          <strong>${tontineId}</strong>

        </div>
      `;

      return;
    }


    // ================================
    // FORMATAGE DES DONNÉES
    // ================================

    let dateDebut =
      tontine.date_debut || "Non définie";


    if (dateDebut !== "Non définie") {

      const date =
        new Date(dateDebut);

      if (!isNaN(date.getTime())) {

        dateDebut =
          date.toLocaleDateString("fr-FR");

      }
    }


    let heureLimite =
      tontine.heure_limite;


    // IMPORTANT :
    // La colonne est actuellement booléenne

    if (heureLimite === true) {

      heureLimite = "18:00";

    } else if (
      heureLimite === false ||
      heureLimite === null ||
      heureLimite === undefined
    ) {

      heureLimite = "Non définie";

    } else {

      heureLimite =
        String(heureLimite);

    }


    // ================================
    // AFFICHER LA TONTINE
    // ================================

    content.className = "";

    content.innerHTML = `

      <div class="card">

        <h2>
          ${tontine.nom || "Tontine"}
        </h2>

        <p class="description">

          ${
            tontine.description ||
            "Aucune description disponible."
          }

        </p>


        <div class="info">

          <span class="label">
            💰 Montant de la prise
          </span>

          <span class="value">

            ${
              Number(
                tontine.montant_prise || 0
              ).toLocaleString("fr-FR")
            }

            F CFA

          </span>

        </div>


        <div class="info">

          <span class="label">
            💵 Cotisation
          </span>

          <span class="value">

            ${
              Number(
                tontine.cotisation || 0
              ).toLocaleString("fr-FR")
            }

            F CFA / jour

          </span>

        </div>


        <div class="info">

          <span class="label">
            🔄 Fréquence
          </span>

          <span class="value">

            ${tontine.frequence || "Non définie"}

          </span>

        </div>


        <div class="info">

          <span class="label">
            👥 Membres
          </span>

          <span class="value">

            ${tontine.nombre_membres || "Non défini"}

          </span>

        </div>


        <div class="info">

          <span class="label">
            📅 Durée
          </span>

          <span class="value">

            ${
              tontine.duree_jours ||
              "Non définie"
            }

            jours

          </span>

        </div>


        <div class="info">

          <span class="label">
            ⚠️ Pénalité
          </span>

          <span class="value">

            ${
              Number(
                tontine.penalite_par_jour || 0
              ).toLocaleString("fr-FR")
            }

            F CFA / jour

          </span>

        </div>


        <div class="info">

          <span class="label">
            📆 Date de début
          </span>

          <span class="value">

            ${dateDebut}

          </span>

        </div>


        <div class="info">

          <span class="label">
            🕕 Heure limite
          </span>

          <span class="value">

            ${heureLimite}

          </span>

        </div>


        <button
          class="button primary"
          onclick="adherer()">

          📝 Adhérer à cette tontine

        </button>

      </div>


      <div id="adhesionMessage"></div>

    `;

  }

  catch (error) {

    console.error(
      "ERREUR JAVASCRIPT :",
      error
    );


    content.innerHTML = `

      <div class="error">

        <strong>
          ❌ Erreur JavaScript
        </strong>

        <br><br>

        ${error.message}

      </div>

    `;

  }

}


// ================================
// ADHÉSION
// ================================

function adherer() {

  const message =
    document.getElementById(
      "adhesionMessage"
    );


  message.innerHTML = `

    <div class="success">

      <strong>
        ✅ Demande d'adhésion
      </strong>

      <br><br>

      Votre demande est prête à être enregistrée.

    </div>

  `;

}


// ================================
// LANCER
// ================================

loadTontine();

      </script>
