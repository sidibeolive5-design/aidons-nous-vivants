<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Détails de la tontine - AIDONS-NOUS VIVANTS</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7f5;
      color: #222;
    }

    header {
      background: #00843d;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    .container {
      max-width: 700px;
      margin: 25px auto;
      padding: 15px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 22px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .loading {
      text-align: center;
      padding: 40px 10px;
      font-size: 18px;
    }

    h2 {
      color: #00843d;
      margin-top: 0;
    }

    .description {
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .info {
      margin-top: 10px;
    }

    .info div {
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }

    .label {
      font-weight: bold;
      color: #555;
    }

    .value {
      color: #111;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      border: none;
      border-radius: 8px;
      background: #00843d;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #006f32;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .success {
      margin-top: 20px;
      padding: 18px;
      border-radius: 8px;
      background: #e8f7ed;
      color: #146c35;
      line-height: 1.6;
    }

    .error {
      margin-top: 20px;
      padding: 18px;
      border-radius: 8px;
      background: #fdeaea;
      color: #a40000;
      line-height: 1.6;
    }

    .reference {
      font-size: 13px;
      word-break: break-all;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<header>
  <h1>AIDONS-NOUS VIVANTS</h1>
</header>

<div class="container">
  <div class="card" id="content">
    <div class="loading">
      ⏳ Chargement de la tontine...
    </div>
  </div>
</div>

<script>
  /* =========================
     CONFIGURATION SUPABASE
     ========================= */

  const SUPABASE_URL =
    "https://wwmndbzifmlqpkbpcntz.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_jnjVBvAwxelousFOy8UEzC_QZ4mb86b";

  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


  /* =========================
     RÉCUPÉRER L'ID DE LA TONTINE
     ========================= */

  const params = new URLSearchParams(window.location.search);
  const tontineId = params.get("id");

  const content = document.getElementById("content");


  /* =========================
     CHARGER LA TONTINE
     ========================= */

  async function loadTontine() {

    if (!tontineId) {
      content.innerHTML = `
        <div class="error">
          ❌ Aucune tontine sélectionnée.
        </div>
      `;
      return;
    }

    const {
      data: tontine,
      error
    } = await supabaseClient
      .from("tontines")
      .select("*")
      .eq("id", tontineId)
      .maybeSingle();

    if (error) {
      console.error(error);

      content.innerHTML = `
        <div class="error">
          ❌ Impossible de charger la tontine.
          <br><br>
          ${escapeHtml(error.message)}
        </div>
      `;

      return;
    }

    if (!tontine) {
      content.innerHTML = `
        <div class="error">
          ❌ Cette tontine n'existe pas.
        </div>
      `;

      return;
    }


    /* =========================
       AFFICHAGE
       ========================= */

    content.innerHTML = `

      <h2>
        ${escapeHtml(tontine.nom || "Tontine")}
      </h2>

      <div class="description">
        ${escapeHtml(tontine.description || "Aucune description disponible.")}
      </div>

      <div class="info">

        <div>
          <span class="label">💰 Montant de la prise :</span><br>
          <span class="value">
            ${formatMoney(tontine.montant_prise)}
          </span>
        </div>

        <div>
          <span class="label">💵 Cotisation :</span><br>
          <span class="value">
            ${formatMoney(tontine.cotisation)}
          </span>
        </div>

        <div>
          <span class="label">📅 Fréquence :</span><br>
          <span class="value">
            ${escapeHtml(tontine.frequence || "-")}
          </span>
        </div>

        <div>
          <span class="label">👥 Nombre de membres :</span><br>
          <span class="value">
            ${tontine.nombre_membres ?? "-"}
          </span>
        </div>

        <div>
          <span class="label">⏱️ Durée :</span><br>
          <span class="value">
            ${tontine.duree_jours ?? "-"} jours
          </span>
        </div>

        <div>
          <span class="label">⚠️ Pénalité par jour :</span><br>
          <span class="value">
            ${formatMoney(tontine.penalite_par_jour)}
          </span>
        </div>

        <div>
          <span class="label">📆 Date de début :</span><br>
          <span class="value">
            ${formatDate(tontine.date_debut)}
          </span>
        </div>

        <div>
          <span class="label">🕐 Heure limite :</span><br>
          <span class="value">
            ${escapeHtml(tontine.heure_limite || "-")}
          </span>
        </div>

      </div>

      <button id="adhesionBtn" onclick="adherer()">
        📝 Adhérer à cette tontine
      </button>

      <div id="message"></div>
    `;
  }


  /* =========================
     ADHÉSION
     ========================= */

  async function adherer() {

    const button = document.getElementById("adhesionBtn");
    const message = document.getElementById("message");

    if (!button || !message) return;

    button.disabled = true;
    button.textContent = "⏳ Enregistrement...";

    message.innerHTML = "";


    /* Vérifier la connexion */

    const {
      data: userData,
      error: userError
    } = await supabaseClient.auth.getUser();

    if (
      userError ||
      !userData ||
      !userData.user
    ) {

      button.disabled = false;
      button.textContent = "📝 Adhérer à cette tontine";

      message.innerHTML = `
        <div class="error">
          ❌ Vous devez être connecté pour adhérer à cette tontine.
        </div>
      `;

      return;
    }


    const user = userData.user;


    /* Récupérer les informations du profil */

    const metadata = user.user_metadata || {};

    const nom =
      metadata.nom ||
      metadata.name ||
      metadata.full_name ||
      "";

    const telephone =
      metadata.telephone ||
      metadata.phone ||
      "";


    /* =========================
       ENREGISTRER L'ADHÉSION
       ========================= */

    const {
      data: adhesion,
      error: adhesionError
    } = await supabaseClient
      .from("adhesions")
      .insert({

        user_id: user.id,

        tontine_id: tontineId,

        nom: nom,

        telephone: telephone,

        date_demande: new Date().toISOString(),

        statut: "EN_ATTENTE_VERIFICATION",

        verification_identite: "EN_ATTENTE",

        contrat_statut: "EN_ATTENTE_SIGNATURE"

      })
      .select()
      .single();


    /* =========================
       ERREUR
       ========================= */

    if (adhesionError) {

      console.error(
        "Erreur adhésion :",
        adhesionError
      );

      button.disabled = false;
      button.textContent = "📝 Adhérer à cette tontine";

      message.innerHTML = `
        <div class="error">

          ❌ L'adhésion n'a pas pu être enregistrée.

          <br><br>

          <strong>Erreur :</strong>
          ${escapeHtml(adhesionError.message)}

          <br><br>

          <small>
            Code : ${escapeHtml(adhesionError.code || "-")}
          </small>

        </div>
      `;

      return;
    }


    /* =========================
       SUCCÈS
       ========================= */

    button.disabled = true;
    button.textContent = "✅ Demande enregistrée";

    message.innerHTML = `

      <div class="success">

        <strong>
          ✅ Votre demande d'adhésion a été enregistrée.
        </strong>

        <br><br>

        Votre demande a bien été enregistrée
        dans notre système.

        <br><br>

        <strong>Prochaine étape :</strong>

        <br>

        La vérification de votre identité
        et la signature du contrat individuel.

        <div class="reference">

          Référence de votre demande :
          <br>

          <strong>
            ${escapeHtml(adhesion.id)}
          </strong>

        </div>

      </div>

    `;
  }


  /* =========================
     OUTILS
     ========================= */

  function formatMoney(value) {

    if (
      value === null ||
      value === undefined ||
      value === ""
    ) {
      return "-";
    }

    const number = Number(value);

    if (Number.isNaN(number)) {
      return escapeHtml(String(value));
    }

    return number.toLocaleString("fr-FR") + " FCFA";
  }


  function formatDate(value) {

    if (!value) return "-";

    const date = new Date(value);

    if (Number.isNaN(date.getTime())) {
      return escapeHtml(String(value));
    }

    return date.toLocaleDateString("fr-FR");
  }


  function escapeHtml(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  /* =========================
     LANCER
     ========================= */

  loadTontine();

</script>

</body>
</html>
