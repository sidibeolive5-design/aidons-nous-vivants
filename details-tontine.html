      text-decoration: none;
      font-weight: bold;
      border: none;
      cursor: pointer;
      font-size: 16px;
    }

    .primary {
      background: #0b6b4f;
      color: white;
    }

    .secondary {
      border: 2px solid #0b6b4f;
      color: #0b6b4f;
      background: white;
    }

    .loading {
      text-align: center;
      color: #687282;
      padding: 30px 10px;
    }

    .error {
      background: #fff3f3;
      color: #c62828;
      padding: 15px;
      border-radius: 10px;
      line-height: 1.5;
    }

    .success {
