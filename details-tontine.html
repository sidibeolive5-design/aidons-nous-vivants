<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Détails de la tontine - AIDONS-NOUS VIVANTS</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #222;
    }

    header {
      background: #0f766e;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    header p {
      margin: 0;
    }

    .container {
      max-width: 700px;
      margin: 30px auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .card h2 {
      color: #0f766e;
      margin-top: 0;
    }

    .description {
      color: #555;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .info {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 14px 0;
      border-bottom: 1px solid #eee;
    }

    .label {
      color: #666;
    }

    .value {
      font-weight: bold;
      text-align: right;
    }

    .button {
      display: block;
      width: 100%;
      padding: 15px;
      margin-top: 20px;
      border: none;
      border-radius: 10px;
      text-align: center;
      text-decoration: none;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    .primary {
      background: #0f766e;
      color: white;
    }

    .secondary {
      background: #e5e7eb;
      color: #222;
    }

    .loading {
      background: white;
      padding: 30px;
      border-radius: 15px;
      text-align: center;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
      padding: 20px;
      border-radius: 10px;
      line-height: 1.6;
    }

    .success {
      background: #dcfce7;
      color: #166534;
      padding: 20px;
      border-radius: 10px;
      margin-top: 20px;
      line-height: 1.6;
    }

    footer {
      text-align: center;
      padding: 30px 15px;
      color: #777;
      font-size: 14px;
    }

    @media (max-width: 500px) {
      .info {
        flex-direction: column;
      }

      .value {
        text-align: left;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>AIDONS-NOUS VIVANTS</h1>
  <p>Détails de la tontine</p>
</header>

<div class="container">

  <div id="content" class="loading">
    Chargement de la tontine...
  </div>

  <a href="dashboard.html" class="button secondary">
    ← Retour à mon espace
  </a>

</div>

<footer>
  <p>AIDONS-NOUS VIVANTS</p>
  <p>© 2026 — Ensemble, nous avançons.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://wwmndbzifmlqpkbpcntz.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_jnjVBvAwxelousFOy8UEzQ_CZ4mb86b";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


// Récupérer l'ID dans l'URL

const urlParams =
  new URLSearchParams(window.location.search);

const tontineId =
  urlParams.get("id");


// Charger la tontine

async function loadTontine() {

  const content =
    document.getElementById("content");


  // Vérifier la connexion

  const {
    data: userData,
    error: userError
  } = await supabaseClient.auth.getUser();


  if (userError || !userData.user) {

    window.location.href = "connexion.html";

    return;
  }


  // Vérifier l'ID

  if (!tontineId) {

    content.innerHTML = `
      <div class="error">
        <strong>Tontine introuvable.</strong><br><br>
        Aucun identifiant n'a été trouvé dans l'adresse.
      </div>
    `;

    return;
  }


  // Requête Supabase

  const {
    data: tontine,
    error
  } = await supabaseClient
    .from("tontines")
    .select(`
      id,
      nom,
      description,
      montant_prise,
      cotisation,
      frequence,
      nombre_membres,
      duree_jours,
      penalite_par_jour,
      date_debut,
      heure_limite
    `)
    .eq("id", tontineId)
    .single();


  // Afficher l'erreur exacte

  if (error) {

    console.log("ERREUR DETAILS TONTINE :", error);

    content.innerHTML = `
      <div class="error">
        <strong>❌ Erreur Supabase</strong><br><br>

        Message : ${error.message}<br><br>

        Code : ${error.code || "non disponible"}
      </div>
    `;

    return;
  }


  // Vérifier la donnée

  if (!tontine) {

    content.innerHTML = `
      <div class="error">
        <strong>Tontine introuvable.</strong><br><br>
        Aucune tontine ne correspond à cet identifiant.
      </div>
    `;

    return;
  }


  // Date

  let dateDebut = tontine.date_debut;

  if (dateDebut) {

    const date =
      new Date(dateDebut + "T00:00:00");

    dateDebut =
      date.toLocaleDateString("fr-FR");
  }


  // Heure

  let heureLimite = tontine.heure_limite;

if (heureLimite === true) {
  heureLimite = "18:00";
} else if (heureLimite === false || heureLimite === null) {
  heureLimite = "Non définie";
} else {
  heureLimite = String(heureLimite).substring(0, 5);
  }


  // Afficher la tontine

  content.className = "";

  content.innerHTML = `

    <div class="card">

      <h2>${tontine.nom}</h2>

      <p class="description">
        ${tontine.description || "Aucune description disponible."}
      </p>

      <div class="info">
        <span class="label">💰 Montant de la prise</span>
        <span class="value">
          ${Number(tontine.montant_prise).toLocaleString("fr-FR")} F CFA
        </span>
      </div>

      <div class="info">
        <span class="label">💵 Cotisation</span>
        <span class="value">
          ${Number(tontine.cotisation).toLocaleString("fr-FR")} F CFA / jour
        </span>
      </div>

      <div class="info">
        <span class="label">🔄 Fréquence</span>
        <span class="value">
          ${tontine.frequence}
        </span>
      </div>

      <div class="info">
        <span class="label">👥 Membres</span>
        <span class="value">
          ${tontine.nombre_membres}
        </span>
      </div>

      <div class="info">
        <span class="label">📅 Durée</span>
        <span class="value">
          ${tontine.duree_jours} jours
        </span>
      </div>

      <div class="info">
        <span class="label">⚠️ Pénalité</span>
        <span class="value">
          ${Number(tontine.penalite_par_jour).toLocaleString("fr-FR")} F CFA / jour
        </span>
      </div>

      <div class="info">
        <span class="label">📆 Date de début</span>
        <span class="value">
          ${dateDebut}
        </span>
      </div>

      <div class="info">
        <span class="label">🕕 Heure limite</span>
        <span class="value">
          ${heureLimite}
        </span>
      </div>

      <button
        class="button primary"
        onclick="adherer()">
        📝 Adhérer à cette tontine
      </button>

    </div>

    <div id="adhesionMessage"></div>

  `;
}


// Bouton adhésion

function adherer() {

  const message =
    document.getElementById("adhesionMessage");

  message.innerHTML = `

    <div class="success">

      <strong>✅ Demande d'adhésion</strong><br><br>

      Votre demande est prête à être enregistrée.

      <br><br>

      La prochaine étape sera la vérification
      de votre identité et la signature
      du contrat individuel.

    </div>

  `;

}


// Lancer la fonction

loadTontine();

</script>

</body>
</html>
